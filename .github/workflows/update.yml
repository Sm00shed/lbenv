name: Update Ladybird versions

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: update-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update versions.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const REPO = { owner: 'LadybirdBrowser', repo: 'ladybird' };
            const MAX_PAGES = 3; // cap: abort if last commit not found within 300

            const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
            const nixpkgs = JSON.parse(fs.readFileSync('flake.lock', 'utf8'))
              .nodes.nixpkgs.locked.rev;

            const recorded = Object.values(versions);
            const last = recorded.at(-1) ?? null;

            // Collect commits newer than last recorded; date is in list response (no extra call).
            const fresh = [];
            let pages = 0;
            let found = !last; // first run: no last → seed only newest
            outer:
            for await (const page of github.paginate.iterator(
              github.rest.repos.listCommits, { ...REPO, per_page: 100 },
            )) {
              if (++pages > MAX_PAGES) break;
              for (const c of page.data) {
                if (last && c.sha === last.ladybird) { found = true; break outer; }
                fresh.push({
                  sha: c.sha,
                  date: c.commit.committer.date.slice(0, 10),   // YYYY-MM-DD (UTC)
                  time: c.commit.committer.date.slice(11, 16),  // HH:MM (UTC)
                  title: c.commit.message.split('\n')[0].slice(0, 100),
                });
                if (!last) break outer; // seed: only newest commit
              }
            }
            if (!found) {
              // last.ladybird not in newest 300 commits → force-push or stale versions.json
              core.setFailed(
                `Last recorded commit ${last.ladybird} not found in newest `
                + `${MAX_PAGES * 100} commits; aborting.`,
              );
              return;
            }
            fresh.reverse();

            if (!fresh.length) {
              core.info('No new commits');
              return;
            }

            // Hash normalised overrides (ignores reformatting upstream).
            const overridesAt = async (ref) => {
              const f = await github.rest.repos.getContent(
                { ...REPO, path: 'vcpkg.json', ref },
              );
              const json = JSON.parse(Buffer.from(f.data.content, 'base64').toString());
              return Object.fromEntries((json.overrides ?? []).map(p => [p.name, p.version]));
            };
            const hash = (o) => crypto.createHash('sha256')
              .update(JSON.stringify(Object.entries(o).sort()))
              .digest('hex').slice(0, 8);

            let latestOverrides = null;
            for (const c of fresh) {
              const o = await overridesAt(c.sha);
              latestOverrides = o;
              versions[`${c.date}_${c.sha.slice(0, 8)}`] = {
                ladybird: c.sha,
                nixpkgs,
                vcpkg: hash(o),
                time: c.time,
                title: c.title,
                // flake set in commit 2 (hash only known after commit 1 is pushed)
              };
            }
            fs.writeFileSync('versions.json', JSON.stringify(versions, null, 2) + '\n');
            core.info(`Added ${fresh.length} commits`);

            // Drift check: fetch prev overrides only if vcpkg hash changed.
            if (!last?.vcpkg || last.vcpkg === hash(latestOverrides)) return;

            const prev = await overridesAt(last.ladybird);
            const rows = [...new Set([...Object.keys(prev), ...Object.keys(latestOverrides)])]
              .sort()
              .filter(p => prev[p] !== latestOverrides[p])
              .map(p => `| ${p} | ${prev[p] ?? '-'} | ${latestOverrides[p] ?? '-'} |`);

            const head = fresh.at(-1).sha.slice(0, 8);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `vcpkg drift @ ${head}`,
              labels: ['vcpkg-drift'],
              body: [
                '## vcpkg.json changed in Ladybird',
                '',
                `\`${last.ladybird.slice(0, 8)}\` -> \`${head}\``,
                '',
                '| Package | before | now |',
                '|---|---|---|',
                ...rows,
                '',
                '_Check whether the nixpkgs pins in `flake.nix` need adjusting._',
              ].join('\n'),
            });

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          COUNT=$(git diff --cached versions.json | grep -c '^+.*"ladybird"' || true)

          # Commit 1: entries without flake (hash unknown until after push)
          git commit -m "versions: add $COUNT new Ladybird commits ($(date -u +%F))"
          git pull --rebase --autostash
          git push
          FLAKE_REV=$(git rev-parse HEAD)

          # Commit 2: backfill flake rev into all entries still missing it
          jq --arg rev "$FLAKE_REV" \
            'with_entries(if .value.flake == null then .value.flake = $rev else . end)' \
            versions.json > versions.tmp && mv versions.tmp versions.json

          git add versions.json
          git commit -m "versions: record flake rev ${FLAKE_REV:0:8}"
          git pull --rebase --autostash
          git push
