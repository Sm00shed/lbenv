name: Update Ladybird versions

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update versions.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const REPO = { owner: 'LadybirdBrowser', repo: 'ladybird' };

            const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
            const nixpkgs = JSON.parse(fs.readFileSync('flake.lock', 'utf8'))
              .nodes.nixpkgs.locked.rev;

            const recorded = Object.values(versions);
            const last = recorded.at(-1) ?? null;

            // Collect commits newer than the last recorded one. The list
            // response already carries the commit date, so no extra call per
            // commit is needed for it.
            const fresh = [];
            outer:
            for await (const page of github.paginate.iterator(
              github.rest.repos.listCommits, { ...REPO, per_page: 100 },
            )) {
              for (const c of page.data) {
                if (last && c.sha === last.ladybird) break outer;
                fresh.push({ sha: c.sha, date: c.commit.committer.date.slice(0, 10) });
                if (!last) break outer;   // first run: seed with newest only
              }
            }
            fresh.reverse();

            if (!fresh.length) {
              core.info('No new commits');
              return;
            }

            // Hash the normalised overrides rather than the raw file, so that
            // reformatting upstream does not register as a pin change.
            const overridesAt = async (ref) => {
              const f = await github.rest.repos.getContent(
                { ...REPO, path: 'vcpkg.json', ref },
              );
              const json = JSON.parse(Buffer.from(f.data.content, 'base64').toString());
              return Object.fromEntries((json.overrides ?? []).map(p => [p.name, p.version]));
            };
            const hash = (o) => crypto.createHash('sha256')
              .update(JSON.stringify(Object.entries(o).sort()))
              .digest('hex').slice(0, 8);

            let latestOverrides = null;
            for (const c of fresh) {
              const o = await overridesAt(c.sha);
              latestOverrides = o;
              versions[`${c.date}_${c.sha.slice(0, 8)}`] = {
                ladybird: c.sha,
                nixpkgs,
                vcpkg: hash(o),
                // Flake revision the workflow runs on: it carries the overrides
                // and flake.lock (nixpkgs -> whole toolchain) valid at this point,
                // so `lb use` can freeze the complete environment, not just source.
                flake: context.sha,
              };
            }
            fs.writeFileSync('versions.json', JSON.stringify(versions, null, 2) + '\n');
            core.info(`Added ${fresh.length} commits`);

            // Drift is a change against the previously recorded entry. Only
            // then is the old side fetched, so the diff costs one extra call
            // and only when something actually moved.
            if (!last?.vcpkg || last.vcpkg === hash(latestOverrides)) return;

            const prev = await overridesAt(last.ladybird);
            const rows = [...new Set([...Object.keys(prev), ...Object.keys(latestOverrides)])]
              .sort()
              .filter(p => prev[p] !== latestOverrides[p])
              .map(p => `| ${p} | ${prev[p] ?? '-'} | ${latestOverrides[p] ?? '-'} |`);

            const head = fresh.at(-1).sha.slice(0, 8);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `vcpkg drift @ ${head}`,
              labels: ['vcpkg-drift'],
              body: [
                '## vcpkg.json changed in Ladybird',
                '',
                `\`${last.ladybird.slice(0, 8)}\` -> \`${head}\``,
                '',
                '| Package | before | now |',
                '|---|---|---|',
                ...rows,
                '',
                '_Check whether the nixpkgs pins in `flake.nix` need adjusting._',
              ].join('\n'),
            });

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          COUNT=$(git diff --cached versions.json | grep -c '"ladybird"' || true)
          git commit -m "versions: add $COUNT new Ladybird commits ($(date -u +%F))"
          git pull --rebase --autostash
          git push
